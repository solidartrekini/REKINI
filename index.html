<!doctype html>
<html lang="lv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rēķini un čeki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root { --bg: #eef0ef; --surface: #fff; --line: #d6dbd9; --ink: #18201e; --muted: #5d6965; --accent: #9e2a35; --accent-ink: #fff; --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif }
@media (prefers-color-scheme: dark) { :root { --bg: #141917; --surface: #1c2220; --line: #34403c; --ink: #e8edeb; --muted: #9aa7a2; --accent: #e0707a; --accent-ink: #1a0f10; color-scheme: dark } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); min-height: 100vh; display: grid; place-items: center; padding: 24px 16px }
main { width: min(720px, 100%); display: grid; gap: 24px }
h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; text-wrap: balance }
p { margin: 0; color: var(--muted) }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px }
a.card { display: grid; gap: 6px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; text-decoration: none; color: inherit }
a.card:hover { border-color: var(--accent) }
a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
a.card b { font-size: 19px }
a.card span { color: var(--muted); font-size: 14px }
a.card small { color: var(--accent); font-weight: 500 }
</style></head><body>
<main>
  <div><h1>Ko vēlies darīt?</h1></div>
  <div class="choices">
    <a class="card" href="rekinu-riks.html"><b>Izrakstīt rēķinu</b><span>Klienti, rēķini, PDF un ZIP arhīvs.</span><small>Prasa paroli</small></a>
    <a class="card" href="cekus.html"><b>Saglabāt čekus</b><span>Nofotografē vai augšupielādē čeku, pievieno datumu, veikalu un summu.</span></a>
    <a class="card" href="gramatvedis.html"><b>Grāmatvedei</b><span>Čeki, rēķini un bankas izraksts: apskate un lejupielāde.</span><small>Prasa grāmatveža atslēgu</small></a>
  </div>
</main>
</body></html>
