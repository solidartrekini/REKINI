<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Rēķinu rīks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<style>
/* Layout: app bar with three tabs; invoice view = form column + live A4 sheet, stacking on phones */
:root {
  --bg: #eef0ef;
  --surface: #ffffff;
  --surface-2: #f6f7f6;
  --line: #d6dbd9;
  --ink: #18201e;
  --muted: #5d6965;
  --accent: #9e2a35;       /* Latvian carmine, used sparingly */
  --accent-ink: #ffffff;
  --accent-soft: #f6e6e8;
  --ok: #1f6d4c; --ok-soft: #e1f1e9;
  --warn: #8a5a00; --warn-soft: #fbf0d8;
  --bad: #a3242f; --bad-soft: #f9e2e4;
  --paper: #ffffff; --paper-ink: #1a1a1a; --paper-muted: #666b69; --paper-line: #d9d9d9;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --surface: #1c2220; --surface-2: #222a27; --line: #34403c; --ink: #e8edeb; --muted: #9aa7a2;
  --accent: #e0707a; --accent-ink: #1a0f10; --accent-soft: #3a2125;
  --ok: #6fcf9f; --ok-soft: #173327; --warn: #e6b450; --warn-soft: #3a2f15; --bad: #f08a92; --bad-soft: #3d1e22;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141917; --surface: #1c2220; --surface-2: #222a27; --line: #34403c; --ink: #e8edeb; --muted: #9aa7a2;
  --accent: #e0707a; --accent-ink: #1a0f10; --accent-soft: #3a2125;
  --ok: #6fcf9f; --ok-soft: #173327; --warn: #e6b450; --warn-soft: #3a2f15; --bad: #f08a92; --bad-soft: #3d1e22;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px }
h1, h2, h3 { text-wrap: balance; margin: 0 }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums }

/* app bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
.bar .wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding-block: 12px }
.brand { display: flex; align-items: baseline; gap: 10px }
.brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -.01em }
.brand .stamp { font: 500 11px var(--f-mono); color: var(--accent); border: 1.5px solid var(--accent); padding: 0 6px; border-radius: 3px; transform: rotate(-3deg); letter-spacing: .08em }
nav { display: flex; gap: 4px; flex-wrap: wrap }
nav button { background: none; border: 0; padding: 6px 12px; border-radius: var(--r); color: var(--muted); font: 500 14px var(--f-body); cursor: pointer }
nav button[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line) }
.store-note { margin-left: auto; font-size: 12px; color: var(--muted) }

/* controls */
button, input, select, textarea { font: inherit; color: inherit }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: var(--r); cursor: pointer; font-weight: 500; white-space: nowrap }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.danger { color: var(--bad) }
.btn.ghost { border-color: transparent; background: none }
.btn:disabled { opacity: .5; cursor: default }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0 }
label.f.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink) }
input[type=text], input[type=date], input[type=number], input[type=email], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 9px; font-size: 14px; color: var(--ink) }
textarea { resize: vertical; min-height: 60px }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) }
.grid .span2 { grid-column: span 2 }
@media (max-width: 520px) { .grid .span2 { grid-column: auto } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 16px; min-width: 0 }
.panel h2 { font-size: 15px; font-weight: 600 }
.eyebrow { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.spacer { flex: 1 }
.hint { color: var(--muted); font-size: 13px; margin: 0 }
.banner { background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap }

section.view { padding-top: 20px; display: grid; gap: 16px }

/* invoice list */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.summary div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px }
.summary b { font: 500 20px var(--f-mono); font-variant-numeric: tabular-nums }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px }
table.list { width: 100%; border-collapse: collapse; min-width: 640px }
table.list th { text-align: left; font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line) }
table.list td { padding: 10px 14px; border-bottom: 1px solid var(--line) }
table.list tr:last-child td { border-bottom: 0 }
table.list tbody tr { cursor: pointer }
table.list tbody tr:hover { background: var(--surface-2) }
table.list .r { text-align: right }
.pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 9px; border-radius: 99px; white-space: nowrap }
.pill.draft { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line) }
.pill.issued { background: var(--warn-soft); color: var(--warn) }
.pill.paid { background: var(--ok-soft); color: var(--ok) }
.pill.overdue { background: var(--bad-soft); color: var(--bad) }
.empty { padding: 32px 18px; text-align: center; color: var(--muted) }
.filters { display: flex; gap: 8px; flex-wrap: wrap }
.filters select, .filters input { width: auto }

/* editor */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 1000px) { .editor { grid-template-columns: minmax(0, 1fr) } }
.items { display: grid; gap: 8px }
.item { display: grid; grid-template-columns: minmax(0, 1fr) 70px 64px 96px 72px 32px; gap: 6px; align-items: end }
.item .desc { grid-column: 1 }
.item.novat { grid-template-columns: minmax(0, 1fr) 70px 64px 96px 32px }
.datebtn { display: flex; gap: 6px } .datebtn input { flex: 1 1 0; width: 0; min-width: 0 } .datebtn .btn { padding-inline: 10px }
@media (max-width: 560px) { .item, .item.novat { grid-template-columns: 1fr 1fr 1fr 32px } .item .desc { grid-column: 1 / -1 } .item .price { grid-column: span 1 } }
.item label.f span { white-space: nowrap }
.del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; height: 36px }
.del:hover { color: var(--bad) }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px }

.sheet-holder { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; gap: 8px; min-width: 0 }
.sheet-frame { overflow: hidden; border-radius: 4px; box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 8px 24px rgb(0 0 0 / .08); background: var(--paper) }

/* the A4 sheet: fixed paper colors in both themes */
.sheet { width: 794px; min-height: 1123px; padding: 56px 60px; background: var(--paper); color: var(--paper-ink); font: 12px/1.45 var(--f-body); transform-origin: top left; display: flex; flex-direction: column; gap: 26px }
.sheet .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px }
.sheet .seller-name { font-size: 18px; font-weight: 700 }
.sheet .doc-title { text-align: right }
.sheet .doc-title h2 { font-size: 26px; font-weight: 700; letter-spacing: -.01em }
.sheet .doc-title .no { font: 500 14px var(--f-mono); color: var(--paper-ink) }
.sheet .muted { color: var(--paper-muted) }
.sheet .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 28px }
.sheet .party h4 { margin: 0 0 6px; font: 500 10px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--paper-muted); border-bottom: 1px solid var(--paper-line); padding-bottom: 4px }
.sheet .party .n { font-weight: 600; font-size: 13px }
.sheet dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; margin: 4px 0 0 }
.sheet dt { color: var(--paper-muted) }
.sheet dd { margin: 0; font-variant-numeric: tabular-nums }
.sheet .dates { display: flex; gap: 32px }
.sheet .dates div { display: grid }
.sheet table { width: 100%; border-collapse: collapse }
.sheet th { font: 500 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--paper-muted); text-align: left; border-bottom: 1.5px solid var(--paper-ink); padding: 6px 6px 6px 0 }
.sheet td { padding: 7px 6px 7px 0; border-bottom: 1px solid var(--paper-line); vertical-align: top }
.sheet .r { text-align: right }
.sheet td.r, .sheet .tot dd { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.sheet .tot { margin-left: auto; width: 300px; display: grid; grid-template-columns: 1fr auto; gap: 3px 16px }
.sheet .tot dt { color: var(--paper-muted) }
.sheet .tot .grand { border-top: 1.5px solid var(--paper-ink); padding-top: 6px; margin-top: 4px; font-weight: 700; font-size: 14px; color: var(--paper-ink) }
.sheet .words { border-left: 3px solid #9e2a35; padding-left: 10px }
.sheet .foot { margin-top: auto; border-top: 1px solid var(--paper-line); padding-top: 12px; color: var(--paper-muted); font-size: 11px; display: grid; gap: 4px }
.sheet .example { color: #9e2a35; font: 500 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase }

.clients { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 860px) { .clients { grid-template-columns: minmax(0, 1fr) } }
.ur { display: grid; gap: 6px; background: var(--surface-2); border-radius: var(--r); padding: 12px }
.ur-out { display: grid; gap: 2px }
.ur-hit { text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: var(--r); cursor: pointer; display: grid; gap: 1px }
.ur-hit:hover, .ur-hit:focus-visible { background: var(--surface) }
.ur-hit small { color: var(--muted) }
#lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 16px }
#lock .box { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px; display: grid; gap: 14px }
.err { color: var(--bad); font-size: 13px; margin: 0 }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: var(--r); font-size: 13px; z-index: 20 }
@media (prefers-reduced-motion: no-preference) { .btn, nav button { transition: background .15s, border-color .15s } }
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand"><h1>Rēķinu rīks</h1><span class="stamp">EUR</span></div>
    <nav>
      <button id="tab-invoices" data-tab="invoices" aria-current="true">Rēķini</button>
      <button id="tab-clients" data-tab="clients">Klienti</button>
      <button id="tab-settings" data-tab="settings">Mani rekvizīti</button>
    </nav>
    <span class="store-note" id="store-note">Ielādē datus…</span>
    <button class="btn" id="drive-btn" hidden></button>
    <button class="btn" id="lock-btn" hidden>Aizslēgt</button>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const money = n => new Intl.NumberFormat("lv-LV", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(round2(n || 0));
const today = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const addDays = (iso, d) => { const t = new Date(iso + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + Number(d || 0)); return t.toISOString().slice(0, 10); };
const fmtDate = iso => iso ? iso.split("-").reverse().join(".") : "";
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }

/* Summa vārdiem (latviski) */
const W1 = ["nulle", "viens", "divi", "trīs", "četri", "pieci", "seši", "septiņi", "astoņi", "deviņi"];
const WT = ["desmit", "vienpadsmit", "divpadsmit", "trīspadsmit", "četrpadsmit", "piecpadsmit", "sešpadsmit", "septiņpadsmit", "astoņpadsmit", "deviņpadsmit"];
const WD = ["", "", "divdesmit", "trīsdesmit", "četrdesmit", "piecdesmit", "sešdesmit", "septiņdesmit", "astoņdesmit", "deviņdesmit"];
function under1000(n) {
  const out = []; const h = Math.floor(n / 100), r = n % 100;
  if (h) out.push(h === 1 ? "simts" : W1[h] + " simti");
  if (r >= 10 && r < 20) out.push(WT[r - 10]);
  else { if (r >= 20) out.push(WD[Math.floor(r / 10)]); if (r % 10) out.push(W1[r % 10]); }
  return out.join(" ");
}
function scale(n, one, many) { const w = under1000(n); return n % 10 === 1 && n % 100 !== 11 ? w + " " + one : w + " " + many; }
function numWords(n) {
  if (n === 0) return "nulle";
  const parts = []; const m = Math.floor(n / 1e6), t = Math.floor(n / 1000) % 1000, r = n % 1000;
  if (m) parts.push(scale(m, "miljons", "miljoni"));
  if (t) parts.push(scale(t, "tūkstotis", "tūkstoši"));
  if (r) parts.push(under1000(r));
  return parts.join(" ");
}
function sumWords(total) {
  const cents = Math.round(total * 100); const e = Math.floor(cents / 100), c = cents % 100;
  const s = numWords(e) + " eiro, " + String(c).padStart(2, "0") + (c % 10 === 1 && c !== 11 ? " cents" : " centi");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------- storage: db capability in the artifact, browser storage elsewhere ---------- */
const LS_KEY = "rekinu-riks-v1";
const store = {
  mode: "local", db: null,
  async init() {
    if (window.claude && typeof window.claude.use === "function") {
      try { this.db = await window.claude.use("db"); } catch (e) { this.db = null; }
      if (this.db) this.mode = "db";
    }
  },
  async load() {
    if (this.mode === "db") {
      try {
        const [s, c, i] = await Promise.all([this.db.doc("config/settings").get(), this.db.collection("clients").get(), this.db.collection("invoices").get()]);
        return { settings: s.exists ? s.data() : null, clients: c.docs.map(d => ({ ...d.data(), id: d.id })), invoices: i.docs.map(d => ({ ...d.data(), id: d.id })) };
      } catch (e) { console.warn("db load failed, using browser storage", e); this.mode = "local"; }
    }
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const o = JSON.parse(raw); if (!o.enc) return o; if (LOCK.key) return JSON.parse(await decStr(LOCK.key, o)); }
    } catch (e) { console.warn(e); }
    return { settings: null, clients: [], invoices: [] };
  },
  saveLocal() {
    driveSchedule();
    const data = JSON.stringify({ settings: S.settings, clients: S.clients, invoices: S.invoices });
    if (LOCK.key) {
      LOCK.q = (LOCK.q || Promise.resolve()).then(async () => { const e = await encStr(LOCK.key, data); localStorage.setItem(LS_KEY, JSON.stringify({ enc: 1, ...e })); }).catch(e => console.warn(e));
      return;
    }
    try { localStorage.setItem(LS_KEY, data); } catch (e) {}
  },
  async put(coll, obj) {
    obj.updatedAt = Date.now(); if (coll === "clients") DRIVE.clientsDirty = true;
    if (this.mode === "db") { const { id, ...rest } = obj; await this.db.collection(coll).doc(id).set(JSON.parse(JSON.stringify(rest))); }
    else this.saveLocal();
  },
  async del(coll, id) { if (coll === "clients") DRIVE.clientsDirty = true; if (this.mode === "db") await this.db.collection(coll).doc(id).delete(); else this.saveLocal(); },
  async putSettings(s) { s.updatedAt = Date.now(); if (this.mode === "db") await this.db.doc("config/settings").set(JSON.parse(JSON.stringify(s))); else this.saveLocal(); }
};

async function saveFile(filename, blob) {
  let dl = null;
  if (window.claude && typeof window.claude.use === "function") { try { dl = await window.claude.use("downloads"); } catch (e) {} }
  if (dl) {
    try { await dl.save({ filename, data: blob }); }
    catch (e) { if (e && e.code !== "declined") toast("Failu neizdevās saglabāt: " + (e.message || e.code)); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- state ---------- */
const DEFAULT_SETTINGS = {
  name: 'SIA "SOLIDART"', regNo: "40103952422", vatNo: "", address: "Eduarda Šmita iela 5a, Rīga, LV-1067",
  bank: "Swedbank AS", swift: "HABALV22", iban: "LV49HABA0551041002684", email: "", phone: "",
  prefix: "RR", vatPayer: false, defaultVat: 21, termDays: 14,
  footer: "Rēķins sagatavots elektroniski un ir derīgs bez paraksta."
};
const S = { settings: { ...DEFAULT_SETTINGS }, clients: [], invoices: [], tab: "invoices", editing: null, filter: "all", q: "", clientEditing: null, loaded: false };
const VAT_RATES = [21, 12, 5, 0];
const STATUS = { draft: "Melnraksts", issued: "Izrakstīts", paid: "Apmaksāts", overdue: "Kavēts" };

function statusOf(inv) { return inv.status === "issued" && inv.due && inv.due < today() ? "overdue" : inv.status; }
function totals(inv, vatPayer) {
  const byRate = {}; let net = 0;
  for (const it of inv.items || []) {
    const line = round2((Number(it.qty) || 0) * (Number(it.price) || 0)); net += line;
    const rate = vatPayer ? Number(it.vat) || 0 : 0;
    byRate[rate] = (byRate[rate] || 0) + line;
  }
  const vats = Object.keys(byRate).map(Number).sort((a, b) => b - a).map(r => ({ rate: r, base: round2(byRate[r]), vat: round2(byRate[r] * r / 100) }));
  const vat = round2(vats.reduce((s, v) => s + v.vat, 0));
  return { net: round2(net), vats, vat, total: round2(net + vat) };
}
function nextNumber(dateIso, excludeId) {
  const s = S.settings; const year = (dateIso || today()).slice(0, 4);
  const pre = (s.prefix ? s.prefix + "-" : "") + year + "-";
  let max = 0;
  for (const i of S.invoices) if (i.id !== excludeId && i.number && i.number.startsWith(pre)) { const n = parseInt(i.number.slice(pre.length), 10); if (n > max) max = n; }
  return pre + String(max + 1).padStart(3, "0");
}
function newInvoice() {
  const d = today();
  return { id: uid(), number: nextNumber(d), autoNumber: true, date: d, due: addDays(d, S.settings.termDays), clientId: S.clients[0]?.id || "", status: "draft",
    items: [{ desc: "", qty: 1, unit: "gab.", price: 0, vat: S.settings.defaultVat }], notes: "", _new: true };
}

/* ---------- invoice sheet (A4) ---------- */
function sheetHTML(inv) {
  const seller = inv._new || inv.status === "draft" ? S.settings : (inv.seller || S.settings);
  const buyer = (inv.status === "draft" || !inv.buyer) ? (S.clients.find(c => c.id === inv.clientId) || inv.buyer || {}) : inv.buyer;
  const vp = !!seller.vatPayer; const t = totals(inv, vp);
  const line = it => round2((Number(it.qty) || 0) * (Number(it.price) || 0));
  const kv = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
  return `<div class="sheet">
    ${inv.example ? `<div class="example">Paraugs · aizstāj ar saviem datiem</div>` : ""}
    <div class="top">
      <div><div class="seller-name">${esc(seller.name || "Jūsu uzņēmums")}</div><div class="muted">${esc(seller.address || "")}</div></div>

function fitSheet() {

async function buildPdfBytes(inv) {
  const { PDFDocument, rgb } = PDFLib;
  const doc = await PDFDocument.create(); doc.registerFontkit(fontkit);
  const reg = await doc.embedFont(unb64(FONT_R), { subset: true });
  const bold = await doc.embedFont(unb64(FONT_B), { subset: true });
  const sets = new Map([[reg, new Set(reg.getCharacterSet())], [bold, new Set(bold.getCharacterSet())]]);
  const safe = (str, f) => { const cs = sets.get(f); return [...String(str)].map(c => (c === "\n" || cs.has(c.codePointAt(0)) ? c : "?")).join(""); };
  doc.setTitle("Rēķins " + inv.number); doc.setProducer("Rēķinu rīks"); doc.setCreator("Rēķinu rīks");
  const seller = (inv._new || inv.status === "draft") ? S.settings : (inv.seller || S.settings);
  const buyer = (inv.status === "draft" || !inv.buyer) ? (S.clients.find(c => c.id === inv.clientId) || inv.buyer || {}) : inv.buyer;
  const vp = !!seller.vatPayer, t = totals(inv, vp);
  const W = 595.28, H = 841.89, M = 44, CW = W - 2 * M;
  const INK = rgb(.102, .102, .102), MUT = rgb(.4, .42, .41), LN = rgb(.85, .85, .85), ACC = rgb(.62, .165, .208);
  let page, y;
  const newPage = () => { page = doc.addPage([W, H]); y = M; };
  const txt = (str, x, size, font = reg, color = INK, align = "l", yy = y) => {
    const s2 = safe(str, font); const w = font.widthOfTextAtSize(s2, size);
    page.drawText(s2, { x: align === "r" ? x - w : x, y: H - yy - size * 0.8, size, font, color });
  };
  const rule = (x1, x2, yy, th = .6, color = LN) => page.drawLine({ start: { x: x1, y: H - yy }, end: { x: x2, y: H - yy }, thickness: th, color });
  const wrap = (str, maxW, size, font = reg) => {
    const out = [];
    for (const para of safe(str, font).split("\n")) {
      let cur = "";
      for (let word of para.split(" ")) {
        while (font.widthOfTextAtSize(word, size) > maxW) { // pārlauž ļoti garus vārdus
          let i = word.length; while (i > 1 && font.widthOfTextAtSize(word.slice(0, i), size) > maxW) i--;
          if (cur) { out.push(cur); cur = ""; }
          out.push(word.slice(0, i)); word = word.slice(i);
        }
        const trial = cur ? cur + " " + word : word;
        if (font.widthOfTextAtSize(trial, size) <= maxW) cur = trial; else { if (cur) out.push(cur); cur = word; }
      }
      out.push(cur);
    }
    return out;
  };
  const num = n => money(n);
  newPage();

  // galvene
  txt(seller.name || "Jūsu uzņēmums", M, 15, bold);
  const addr = wrap(seller.address || "", 270, 9);
  addr.forEach((l, i) => txt(l, M, 9, reg, MUT, "l", y + 21 + i * 12));
  txt(vp ? "PVN rēķins" : "Rēķins", W - M, 22, bold, INK, "r", y - 2);
  txt("Nr. " + inv.number, W - M, 11, reg, INK, "r", y + 27);
  y += Math.max(62, 24 + addr.length * 12 + 16);

  // datumi
  txt("Izrakstīšanas datums", M, 8, reg, MUT); txt(fmtDate(inv.date), M, 10, bold, INK, "l", y + 12);
  txt("Apmaksāt līdz", M + 135, 8, reg, MUT); txt(fmtDate(inv.due), M + 135, 10, bold, INK, "l", y + 12);
  y += 40;

  // puses
  const colW = (CW - 24) / 2, lw = 54;
  const party = (title, p, x, withVat) => {
    let yy = y;
    txt(title.toUpperCase(), x, 7.5, reg, MUT, "l", yy); rule(x, x + colW, yy + 12);
    yy += 18;
    wrap(p.name || "—", colW, 10.5, bold).forEach(l => { txt(l, x, 10.5, bold, INK, "l", yy); yy += 14; });
    yy += 2;
    const kv = [["Reģ. nr.", p.regNo], [withVat ? "PVN nr." : "PVN nr.", withVat ? p.vatNo : p.vatNo], ["Adrese", p.address], ["Banka", p.bank], ["SWIFT", p.swift], ["Konts", p.iban], ["E-pasts", p.email], ["Tālr.", p.phone]];
    for (const [k, v] of kv) {
      if (!v || (k === "PVN nr." && withVat === false)) continue;
      const ls = wrap(v, colW - lw, 9);
      txt(k, x, 9, reg, MUT, "l", yy);
      ls.forEach((l, i) => txt(l, x + lw, 9, reg, INK, "l", yy + i * 12));
      yy += ls.length * 12 + 1;
    }
    return yy;
  };
  const y1 = party("Piegādātājs", seller, M, vp), y2 = party("Saņēmējs", buyer, M + colW + 24, true);
  y = Math.max(y1, y2) + 18;

  // tabula
  const sumR = W - M, vatR = vp ? sumR - 72 : null, priceR = vp ? vatR - 38 : sumR - 72, unitL = priceR - 64 - 36, qtyR = unitL - 4, descL = M + 22, descW = qtyR - 48 - 8 - descL;
  const head = () => {
    const f = (s2, x, a) => txt(s2, x, 7.5, reg, MUT, a);
    f("NR.", M, "l"); f("NOSAUKUMS", descL, "l"); f("DAUDZ.", qtyR, "r"); f("MĒRV.", unitL, "l"); f("CENA, EUR", priceR, "r"); if (vp) f("PVN", vatR, "r"); f("SUMMA, EUR", sumR, "r");
    rule(M, W - M, y + 13, 1, INK); y += 19;
  };
  head();
  (inv.items || []).forEach((it, i) => {
    const ls = wrap(it.desc || "—", descW, 9.5), h = Math.max(ls.length, 1) * 12.5 + 8;
    if (y + h > H - M - 20) { newPage(); head(); }
    txt(String(i + 1), M, 9.5, reg, INK, "l", y + 2);
    ls.forEach((l, k) => txt(l, descL, 9.5, reg, INK, "l", y + 2 + k * 12.5));
    txt(String(it.qty).replace(".", ","), qtyR, 9.5, reg, INK, "r", y + 2);
    txt(it.unit || "", unitL, 9.5, reg, INK, "l", y + 2);
    txt(num(it.price), priceR, 9.5, reg, INK, "r", y + 2);
    if (vp) txt((Number(it.vat) || 0) + "%", vatR, 9.5, reg, INK, "r", y + 2);
    txt(num(round2((Number(it.qty) || 0) * (Number(it.price) || 0))), sumR, 9.5, reg, INK, "r", y + 2);
    rule(M, W - M, y + h - 2); y += h;
  });

  // kopsummas
  const need = (2 + t.vats.length) * 16 + 34;
  if (y + need > H - M - 20) newPage();
  y += 12;
  const bx = W - M - 240, row = (label, val, b) => { txt(label, bx, b ? 11 : 9.5, b ? bold : reg, b ? INK : MUT); txt(val, W - M, b ? 11 : 9.5, b ? bold : reg, INK, "r"); y += b ? 18 : 15; };
  row("Summa bez PVN", num(t.net));
  if (vp) t.vats.forEach(v => row(`PVN ${v.rate}% no ${num(v.base)}`, num(v.vat)));
  y += 2; rule(bx, W - M, y, 1, INK); y += 6;
  row("Kopā apmaksai, EUR", num(t.total), true);

  // summa vārdiem
  y += 8;
  const wl = wrap(sumWords(t.total), CW - 14, 10);
  if (y + 12 + wl.length * 13 > H - M - 20) newPage();
  page.drawRectangle({ x: M, y: H - y - 12 - wl.length * 13, width: 2.5, height: 12 + wl.length * 13, color: ACC });
  txt("Summa vārdiem", M + 10, 8, reg, MUT, "l", y); wl.forEach((l, i) => txt(l, M + 10, 10, reg, INK, "l", y + 12 + i * 13));
  y += 12 + wl.length * 13 + 14;

  if (inv.notes) { wrap(inv.notes, CW, 9.5).forEach(l => { if (y > H - M - 80) newPage(); txt(l, M, 9.5); y += 13; }); }

  // kājene lapas apakšā
  const foot = [];
  if (!vp) foot.push("Piegādātājs nav reģistrēts PVN maksātāju reģistrā.");
  if (seller.footer) foot.push(seller.footer);
  foot.push("Maksājuma mērķī lūdzam norādīt rēķina numuru " + inv.number + ".");
  const fh = foot.length * 12 + 12;
  if (y > H - M - fh - 6) newPage();
  const fy = H - M - fh;
  rule(M, W - M, fy);
  foot.forEach((l, i) => txt(l, M, 8, reg, MUT, "l", fy + 8 + i * 12));
  return await doc.save();
}

async function drivePdfQuiet(inv) {
  if (!driveOn()) return;
  if (!DRIVE.tok) { toast("Rēķins saglabāts, bet Drive nav pieslēgts. Spied “Pieslēgt Google Drive” augšā, tad Iestatījumos “Saglabāt visus PDF Drive”."); return; }
  if (typeof PDFLib === "undefined" || typeof fontkit === "undefined") { toast("PDF bibliotēka nav ielādējusies, PDF nav saglabāts Drive."); return; }
  try {
    const blob = new Blob([await buildPdfBytes(inv)], { type: "application/pdf" });
    await driveUploadPdf(`Rekins_${inv.number.replace(/[^\w.-]+/g, "_")}.pdf`, blob, inv.date);
    toast("Rēķins " + inv.number + " saglabāts Google Drive");
  } catch (e) { console.warn(e); toast("PDF neizdevās saglabāt Drive: " + e.message); }
}
async function driveUploadAll() {
  if (!DRIVE.tok) { toast("Vispirms pieslēdz Google Drive (poga augšā)"); return; }
  const list = S.invoices.filter(i => i.status !== "draft" && !i.example);
  if (!list.length) { toast("Nav izrakstītu rēķinu, ko saglabāt (melnraksti netiek augšupielādēti)"); return; }
  let n = 0, bad = 0;
  for (const inv of list) {
    try { await driveUploadPdf(`Rekins_${inv.number.replace(/[^\w.-]+/g, "_")}.pdf`, new Blob([await buildPdfBytes(inv)], { type: "application/pdf" }), inv.date); n++; toast(`Drive: ${n}/${list.length}…`); }
    catch (e) { console.warn(e); bad++; if (DRIVE.state === "expired") break; }
  }
  toast(bad ? `Saglabāti ${n}, neizdevās ${bad}. Pārbaudi Drive pieslēgumu.` : `Saglabāti Drive: ${n} rēķini`);
}
async function downloadPDF(inv) {
  if (typeof PDFLib === "undefined" || typeof fontkit === "undefined") { toast("PDF bibliotēka nav ielādējusies. Pārlādē lapu."); return; }
  try {
    const blob = new Blob([await buildPdfBytes(inv)], { type: "application/pdf" });
    const pdfName = `Rekins_${inv.number.replace(/[^\w.-]+/g, "_")}.pdf`;
    if (DRIVE.tok) { try { await driveUploadPdf(pdfName, blob, inv.date); toast("PDF saglabāts Google Drive"); } catch (e) { console.warn(e); toast("PDF neizdevās saglabāt Drive: " + e.message); } }
    await saveFile(pdfName, blob);
  } catch (e) { console.error(e); toast("PDF neizdevās izveidot."); }
}

async function guarded(fn) { try { await fn(); return true; } catch (e) { console.error(e); toast("Neizdevās saglabāt: " + (e.message || e.code || "kļūda")); return false; } }
function openInvoice(id) { const i = S.invoices.find(x => x.id === id); if (!i) return; S.editing = JSON.parse(JSON.stringify(i)); S.confirmDel = false; render(); }
async function saveInvoice() {
  const inv = S.editing;
  if (!inv.number.trim()) { toast("Ievadi rēķina numuru"); return; }
  if (S.invoices.some(i => i.id !== inv.id && i.number === inv.number.trim())) { toast("Rēķins ar šādu numuru jau ir"); return; }
  if (inv.status !== "draft" && !inv.clientId && !inv.buyer) { toast("Izvēlies klientu"); return; }
  const out = JSON.parse(JSON.stringify(inv)); delete out._new; out.number = out.number.trim(); out.example = false;
  if (out.status === "draft" || !out.seller) { out.seller = { ...S.settings }; delete out.seller.example; }
  const cl = S.clients.find(c => c.id === out.clientId); if (cl && (out.status === "draft" || !inv.buyer || inv._new)) out.buyer = { name: cl.name, regNo: cl.regNo, vatNo: cl.vatNo, address: cl.address, email: cl.email };
  const k = S.invoices.findIndex(i => i.id === out.id); if (k >= 0) S.invoices[k] = out; else S.invoices.push(out);
  S.editing = JSON.parse(JSON.stringify(out));
  const ok = await guarded(() => store.put("invoices", out));
  if (ok) toast("Rēķins " + out.number + " saglabāts");
  render();
  if (ok && out.status !== "draft") await drivePdfQuiet(out);
}

/* ---------- Uzņēmumu reģistra atvērtie dati (ur-dati.bin: gzip TSV regcode\tname\taddress) ---------- */
const UR = { state: "idle", rows: null, keys: null, p: null };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/["'„“”«»]/g, "");
function urLoad() {
  if (UR.p) return UR.p;
  UR.state = "loading";
  UR.p = (async () => {
    const r = await fetch("ur-dati.bin"); if (!r.ok) throw new Error(r.status);
    const buf = new Uint8Array(await r.arrayBuffer());
    let text;
    if (buf[0] === 0x1f && buf[1] === 0x8b) text = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    else text = new TextDecoder().decode(buf);
    UR.rows = text.split("\n").filter(Boolean).map(l => l.split("\t"));
    UR.keys = UR.rows.map(r => norm(r[1]));
    UR.state = "ready";
  })().catch(e => { console.warn("UR dati nav pieejami", e); UR.state = "missing"; });
  return UR.p;
}
async function urSearch(q) {
  const out = $("#ur-out"); if (!out) return;
  q = q.trim();
  if (q.length < 3) { out.innerHTML = `<p class="hint">Ieraksti vismaz 3 simbolus.</p>`; return; }
  if (UR.live !== false) {
    const live = await urLive(q);
    if ($("#ur-q")?.value.trim() !== q) return;
    if (live) { UR.hits = live; out.innerHTML = live.length ? live.map((h, i) => `<button type="button" class="ur-hit" data-ur-live="${i}"><span>${esc(h[1])}</span><small class="num">${esc(h[0])} · ${esc(h[2])}</small></button>`).join("") : `<p class="hint">Nekas netika atrasts. Pārbaudi numuru vai nosaukumu.</p>`; return; }
  }
  if (UR.state !== "ready") { out.innerHTML = `<p class="hint">Ielādē reģistra datus…</p>`; await urLoad(); }
  if (UR.state === "missing") { out.innerHTML = `<p class="hint">Reģistra dati šeit nav pieejami${UR.err ? " (kļūda: " + esc(UR.err) + ")" : ""}. Rekvizītus ievadi paši.</p>`; return; }
  if ($("#ur-q")?.value.trim() !== q) return;
  const hits = []; const digits = /^\d+$/.test(q); const nq = norm(q).split(/\s+/).filter(Boolean);
  for (let i = 0; i < UR.rows.length && hits.length < 8; i++) {
    if (digits ? UR.rows[i][0].startsWith(q) : nq.every(w => UR.keys[i].includes(w))) hits.push(i);
  }
  out.innerHTML = hits.length ? hits.map(i => { const [reg, name, addr] = UR.rows[i]; return `<button type="button" class="ur-hit" data-ur="${i}"><span>${esc(name)}</span><small class="num">${esc(reg)} · ${esc(addr || "")}</small></button>`; }).join("")
    : `<p class="hint">Nekas netika atrasts. Pārbaudi numuru vai nosaukumu.</p>`;
}
/* Tiešsaistes meklēšana data.gov.lv (strādā, ja lapa drīkst sazināties ar data.gov.lv; claude.ai lapā tas ir bloķēts) */
const UR_API = "https://data.gov.lv/dati/api/3/action/datastore_search?resource_id=25e80bf3-f107-4ab4-89ef-251b5b9374e9&limit=30";
async function urLive(q) {
  try {
    const words = q.split(/\s+/).map(w => w.replace(/[^\p{L}\p{N}]/gu, "")).filter(Boolean);
    const qs = /^\d+$/.test(q) ? "&q=" + encodeURIComponent(q) : "&plain=false&q=" + encodeURIComponent(words.map(w => w + ":*").join(" & "));
    const r = await fetch(UR_API + qs); if (!r.ok) throw new Error(r.status);
    const j = await r.json(); UR.live = true;
    return j.result.records.filter(x => !x.terminated).slice(0, 8)
      .map(x => [String(x.regcode), x.name, [x.address, x.index ? "LV-" + String(x.index).padStart(4, "0") : ""].filter(Boolean).join(", ")]);
  } catch (e) { console.warn("data.gov.lv nav pieejams", e); UR.live = false; UR.err = String((e && e.message) || e); return null; }
}

/* ---------- paroles aizsardzība (AES-GCM, atslēga no paroles ar PBKDF2); darbojas tikai ārpus claude.ai ---------- */
const LOCK_KEY = "rekinu-riks-lock";
const LOCK = { key: null, q: null };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const b64 = buf => { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode(...a.subarray(i, i + 8192)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encStr(key, str) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return { iv: b64(iv), ct: b64(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(str))) };
}
async function decStr(key, o) { return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.iv) }, key, unb64(o.ct))); }
const lockMeta = () => { try { return JSON.parse(lsGet(LOCK_KEY)); } catch (e) { return null; } };

function unlockFlow() {
  return new Promise(resolve => {
    const meta = lockMeta();
    const el = document.createElement("div"); el.id = "lock";
    el.innerHTML = `<form class="box" id="lock-form">
      <div class="brand"><h1>Rēķinu rīks</h1><span class="stamp">EUR</span></div>
      <label class="f">Parole<input type="password" id="lock-pw" autocomplete="current-password" required></label>
      <p class="err" id="lock-err" hidden></p>
      <button class="btn primary" type="submit">Atslēgt</button>
      <div id="lock-forgot"><button class="btn ghost" type="button" id="lock-forgot-btn" style="padding:0;color:var(--muted)">Aizmirsu paroli</button></div>
    </form>`;
    document.body.appendChild(el);
    $("#lock-pw").focus();
    $("#lock-form").addEventListener("submit", async e => {
      e.preventDefault(); const err = $("#lock-err"); err.hidden = true;
      try {
        const key = await deriveKey($("#lock-pw").value, unb64(meta.salt), meta.iter);
        if ((await decStr(key, meta.check)) !== "ok") throw new Error();
        LOCK.key = key; el.remove(); resolve();
      } catch (x) { err.textContent = "Nepareiza parole."; err.hidden = false; $("#lock-pw").select(); }
    });
    $("#lock-forgot").addEventListener("click", e => {
      if (e.target.id === "lock-forgot-btn") {
        $("#lock-forgot").innerHTML = `<p class="hint">Šajā pārlūkā saglabātie dati tiks izdzēsti, un paroles aizsardzība tiks noņemta. Ja esi pieslēdzis Google Drive, dati no tā atgriezīsies pēc pieslēgšanās.</p><button class="btn danger" type="button" id="lock-wipe">Dzēst datus šajā pārlūkā</button>`;
      } else if (e.target.id === "lock-wipe") {
        try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LOCK_KEY); } catch (x) {}
        location.reload();
      }
    });
  });
}
async function enableLock(pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iter = 250000;
