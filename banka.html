<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? `${m[3]}/${m[2]}/${m[1]}` : "—"; };
const MONTHS = ["janvāris", "februāris", "marts", "aprīlis", "maijs", "jūnijs", "jūlijs", "augusts", "septembris", "oktobris", "novembris", "decembris"];
const monthName = k => `${k.slice(0, 4)}. ${MONTHS[Number(k.slice(5)) - 1]}`;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3500); }
if (window.top !== window) document.documentElement.classList.add("framed");

const ACC = /[?&]acc=1/.test(location.search);
const TKEY = ACC ? "rr-atoken" : "rr-token";
async function srv(path, opt = {}, retry = true) {
  let t = ""; try { t = localStorage.getItem(TKEY) || ""; } catch (e) {}
  if (!t) { t = (prompt(ACC ? "Ievadi grāmatveža atslēgu:" : "Ievadi rēķinu rīka paroli:") || "").trim(); if (t) try { localStorage.setItem(TKEY, t); } catch (e) {} }
  const r = await fetch("api/" + path, { ...opt, headers: { Authorization: "Bearer " + t } });
  if (r.status === 401) { try { localStorage.removeItem(TKEY); } catch (e) {} if (retry) return srv(path, opt, false); throw new Error("Nepareiza atslēga"); }
  if (!r.ok) { let m = ""; try { m = (await r.json()).error; } catch (e) {} throw new Error(m || "Servera kļūda " + r.status); }
  return r;
}

/* ---------- izraksta nolasīšana ---------- */
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
function parseDate(t) {

  if ((m = /^(\d{1,2})[-./](\d{1,2})[-./](\d{4})/.exec(t))) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if ((m = /^(\d{4})(\d{2})(\d{2})$/.exec(t))) return `${m[1]}-${m[2]}-${m[3]}`;
  return "";
}
function parseAmount(t) {
  let s = String(t ?? "").replace(/[\s ]/g, "").replace(/[^\d,.\-+]/g, ""); if (!s || !/\d/.test(s)) return NaN;
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");

}
function splitCsv(text) {

  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }

const ALIAS = {
  date: ["datums", "date", "booking date", "bookingdate", "buchungstag", "darijuma datums", "valutas datums", "value date"],
  amount: ["summa", "amount", "apjoms", "betrag"],
  dc: ["debets/kredits", "d/k", "debit/credit", "dk", "cdtdbtind", "debets kredits", "deb/kred"],
  debit: ["debets", "debit", "izdevumi", "izmaksas"], credit: ["kredits", "credit", "ienakumi", "ienakumi"],
  name: ["sanemejs/maksatajs", "sanemejs", "maksatajs", "partner", "counterparty", "name", "beneficiary", "nosaukums", "partnera nosaukums", "sanemeja nosaukums", "maksataja nosaukums"],
  desc: ["informacija sanemejam", "detalas", "description", "details", "paskaidrojums", "maksajuma merkis", "maksajuma detalas", "informacija", "purpose", "reference", "merkis"],
  type: ["ieraksta tips", "record type"], cur: ["valuta", "currency", "ccy"]

// Swedbank CSV bez virsrakstu rindas: konts;tips;datums;partneris | BIC | IBAN;detaļas;summa;valūta;D/K;atsauce;kods
function fromSwedbankPlain(rows) {
  const ok = r => r.length >= 8 && /^\d{2}$/.test(String(r[1]).trim()) && /^\d{1,2}[./-]\d{1,2}[./-]\d{4}$/.test(String(r[2]).trim());
  if (!rows.slice(0, 3).some(ok)) return null;
  const out = [], own = (S.settings && S.settings.regNo) || "40103952422", pd8 = rows.filter(ok).map(r => parseDate(r[2])).filter(Boolean).sort();
  for (const r of rows) {
    if (!ok(r) || String(r[1]).trim() !== "20") continue;
    const date = parseDate(r[2]); let amt = parseAmount(r[5]); if (!date || isNaN(amt)) continue;
    amt = /^d/i.test(String(r[7]).trim()) ? -Math.abs(amt) : Math.abs(amt);
    const party = String(r[3] || "").split("|").map(x => x.trim()), desc = String(r[4] || "").trim(), code = String(r[9] || "").trim();
    let name = party[0] || "", pdate = "";
    if (/^PIRKUMS\b/i.test(desc)) {
      const pd = /(\d{2}\.\d{2}\.\d{4})\s+[\d.,]+\s*EUR/.exec(desc); if (pd) pdate = parseDate(pd[1]);
      if (!name) { const m = /\)\s*(.+?)(?:\s+LV-\d{4}.*)?$/.exec(desc); if (m) name = m[1].trim(); }
    }
    const t = { date, amount: Math.round(amt * 100) / 100, name, desc, cur: String(r[6] || "").trim() };
    if (pdate) t.pdate = pdate;
    if (code === "KOM") t.kind = "Bankas komisija";
    else if (party.includes(own) || /^\d{11}$/.test(party[1] || "") && party[1] === own) t.kind = "Pārvedums starp saviem kontiem";
    out.push(t);
  }

  return out.length ? out : null;
}
function fromCsv(text) {
  const rows = splitCsv(text); if (rows.length < 2) throw new Error("Fails ir tukšs vai nav CSV");
  const sw = fromSwedbankPlain(rows); if (sw) return sw;
  let hi = rows.findIndex(r => r.map(norm).some(x => ALIAS.date.includes(x)) && r.map(norm).some(x => [...ALIAS.amount, ...ALIAS.debit].includes(x)));
  if (hi < 0) throw new Error("Neatpazīju kolonnas. Atrastās kolonnas: " + rows[0].map(x => x.trim()).filter(Boolean).join(", "));
  const H = rows[hi].map(norm), col = k => { for (const a of ALIAS[k]) { const i = H.indexOf(a); if (i >= 0) return i; } return -1; };
  const ci = Object.fromEntries(Object.keys(ALIAS).map(k => [k, col(k)]));
  if (ci.amount < 0 && ci.debit < 0) throw new Error("Nav atrasta summas kolonna");
  const body = rows.slice(hi + 1), hasType = ci.type >= 0 && body.some(r => String(r[ci.type]).trim() === "20");
  const out = [];
  for (const r of body) {
    if (hasType && String(r[ci.type]).trim() !== "20") continue;
    const date = parseDate(r[ci.date]); if (!date) continue;
    let amt;
    if (ci.amount >= 0) {
      amt = parseAmount(r[ci.amount]); if (isNaN(amt)) continue;
      if (ci.dc >= 0) { const d = norm(r[ci.dc]); if (/^(d|db|dbit|debit|debets)/.test(d)) amt = -Math.abs(amt); else if (/^(k|c|cr|crdt|credit|kredits)/.test(d)) amt = Math.abs(amt); }
    } else {
      const d = parseAmount(r[ci.debit]), c = ci.credit >= 0 ? parseAmount(r[ci.credit]) : NaN;
      if (!isNaN(d) && d) amt = -Math.abs(d); else if (!isNaN(c) && c) amt = Math.abs(c); else continue;
    }
    out.push({ date, amount: Math.round(amt * 100) / 100, name: ci.name >= 0 ? String(r[ci.name]).trim() : "", desc: ci.desc >= 0 ? String(r[ci.desc]).trim() : "", cur: ci.cur >= 0 ? String(r[ci.cur]).trim() : "" });

}
function fromXml(text) {

  const first = (el, n) => { const x = tags(el, n)[0]; return x ? x.textContent.trim() : ""; };
  const ents = tags(doc, "Ntry"); if (!ents.length) throw new Error("XML failā nav atrasti ieraksti (Ntry). Atbalstīts camt.053 formāts.");
  return ents.map(e => {

    const debit = first(e, "CdtDbtInd") === "DBIT", a = Math.abs(parseAmount(amtEl ? amtEl.textContent : ""));
    const bk = tags(e, "BookgDt")[0], vl = tags(e, "ValDt")[0];
    const date = parseDate((bk && bk.textContent.trim()) || (vl && vl.textContent.trim()) || "");
    const party = tags(e, "RltdPties")[0]; let name = "";
    if (party) { const p = tags(party, debit ? "Cdtr" : "Dbtr")[0]; name = p ? first(p, "Nm") : ""; }
    const desc = tags(e, "Ustrd").map(x => x.textContent.trim()).join(" ") || first(e, "AddtlTxInf") || first(e, "AddtlNtryInf");
    return { date, amount: debit ? -a : a, name, desc, cur };
  }).filter(t => t.date && !isNaN(t.amount));
}
async function readFileText(f) {
  const buf = await f.arrayBuffer(); let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes("�")) t = new TextDecoder("windows-1257").decode(buf);
  return t.replace(/^﻿/, "");
}
function parseStatement(text, filename) {
  const isXml = /^\s*<\?xml|^\s*<Document/i.test(text) || /\.xml$/i.test(filename);
  return isXml ? fromXml(text) : fromCsv(text);
}

/* ---------- glabāšana: pa mēnešiem ---------- */
const S = { sort: { k: "date", d: 1 }, banks: [], receipts: [], month: "", showIn: false, onlyMiss: false, loaded: false };
const txKeyBase = t => `${t.date}|${t.amount.toFixed(2)}|${norm(t.name + " " + t.desc).slice(0, 60)}`;
function withIds(list) { const seen = {}; return list.map(t => { const b = txKeyBase(t); seen[b] = (seen[b] || 0) + 1; return { ...t, id: b + "|" + seen[b] }; }); }
async function saveStatement(list, filename, period) {
  const byM = {}; for (const t of withIds(list)) (byM[t.date.slice(0, 7)] ||= []).push(t);
  const months = Object.keys(byM).sort();
  for (const mk of months) {
    const old = S.banks.find(b => b.id === mk) || { txs: [], links: {}, ignore: {} };
    const have = new Map(old.txs.map(t => [t.id, t]));
    for (const t of byM[mk]) have.set(t.id, have.get(t.id) || t);
    const txs = [...have.values()].sort((a, b) => a.date.localeCompare(b.date));
    const per = period || [list.map(t => t.date).sort()[0], list.map(t => t.date).sort().pop()];
    const doc = { txs, links: old.links || {}, ignore: old.ignore || {}, file: filename, periods: [...(old.periods || []), per], updatedAt: Date.now() };
    await srv("acc/bank/" + mk, { method: "PUT", body: JSON.stringify(doc) });
  }
  return months;
}
async function persist(mk) {
  const b = S.banks.find(x => x.id === mk); if (!b) return;
  const { id, ...doc } = b; doc.updatedAt = Date.now();
  await srv("acc/bank/" + mk, { method: "PUT", body: JSON.stringify(doc) });
}

/* ---------- saistīšana ar čekiem ---------- */
function matchAll() {
  const recById = new Map(S.receipts.map(r => [r.id, r])), used = new Set(), res = new Map();
  const all = S.banks.flatMap(b => b.txs.map(t => ({ t, b })));
  for (const { t, b } of all) { const rid = (b.links || {})[t.id]; if (rid && recById.has(rid)) { used.add(rid); res.set(t.id, { rid, manual: true }); } }
  const day = s => Date.parse(s + "T00:00:00Z") / 864e5;
  const cand = all.filter(({ t, b }) => t.amount < 0 && !res.has(t.id) && !t.kind && !(b.ignore || {})[t.id]).sort((x, y) => x.t.date.localeCompare(y.t.date));
  for (const { t } of cand) {
    let best = null, bs = 1e9;
    for (const r of S.receipts) {
      if (used.has(r.id) || r.total == null || r.total === "" || !r.date) continue;
      if (Math.abs(Number(r.total) - Math.abs(t.amount)) > 0.005) continue;
      const dd = Math.min(Math.abs(day(r.date) - day(t.date)), t.pdate ? Math.abs(day(r.date) - day(t.pdate)) : 99); if (dd > 7) continue;
      const shop = norm(r.shop && r.shop.name).replace(/\b(sia|as|ik|zs|oy|ab)\b/g, "").trim(), hay = norm(t.name + " " + t.desc);
      const sc = dd - (shop.length > 2 && hay.includes(shop.split(" ")[0]) ? 0.5 : 0);
      if (sc < bs) { bs = sc; best = r; }
    }
    if (best) { used.add(best.id); res.set(t.id, { rid: best.id, manual: false }); }
  }
  return { res, used };
}

/* ---------- skats ---------- */
function monthView() {
  const b = S.banks.find(x => x.id === S.month); if (!b) return "";
  const { res, used } = matchAll(), recById = new Map(S.receipts.map(r => [r.id, r]));
  const outs = b.txs.filter(t => t.amount < 0), ins = b.txs.filter(t => t.amount >= 0);
  const ign = t => !!(b.ignore || {})[t.id] || !!t.kind;
  const have = outs.filter(t => res.has(t.id)).length, skip = outs.filter(t => !res.has(t.id) && ign(t)).length, miss = outs.length - have - skip;
  let rows = b.txs.filter(t => S.showIn || t.amount < 0);
  { const { k, d } = S.sort, val = t => k === "amount" ? t.amount : k === "name" ? norm(t.name) : k === "st" ? (t.amount >= 0 ? 3 : res.has(t.id) ? 2 : ign(t) ? 1 : 0) : t.date;
    rows = rows.slice().sort((a, c) => { const x = val(a), y = val(c); return ((x < y ? -1 : x > y ? 1 : 0) || a.date.localeCompare(c.date)) * d; }); }

  return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("Bildi neizdevās nolasīt")); im.src = u; });
}
function loadScriptOnce(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Neizdevās ielādēt PDF bibliotēku")); document.head.appendChild(s); }); }
async function fileToPages(file) {
  const srcs = [];
  if (/pdf/i.test(file.type) || /\.pdf$/i.test(file.name)) {
    const U = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    if (!window.pdfjsLib) { await loadScriptOnce(U + "pdf.min.js"); pdfjsLib.GlobalWorkerOptions.workerSrc = U + "pdf.worker.min.js"; }
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    for (let n = 1; n <= Math.min(pdf.numPages, 5); n++) {
      const page = await pdf.getPage(n), v0 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: 1800 / Math.max(v0.width, v0.height) });
      const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); await page.render({ canvasContext: x, viewport: vp }).promise; srcs.push(c);
    }
  } else srcs.push(await decodeImg(file));
  const out = [];
  for (const im of srcs) {
    let big = await canvasBlob(im, 1800, .82); if (big.size > 1_300_000) big = await canvasBlob(im, 1400, .7);
    out.push({ big, thumb: "data:image/jpeg;base64," + await b64Blob(await canvasBlob(im, 260, .7)) });
  }
  return out;
}
async function addReceiptFor(txId, file) {
  const b = S.banks.find(x => x.id === S.month), t = b && b.txs.find(x => x.id === txId); if (!t) return;
  toast("Augšupielādē čeku…");
  const pgs = await fileToPages(file), id = uid(), pages = pgs.map((p, i) => ({ id: i === 0 ? id : uid(), thumb: p.thumb }));
  const rec = { date: t.date, total: Math.abs(t.amount), shop: { name: t.name || "" }, pay: "", author: "", note: t.desc || "", text: "", thumb: pages[0].thumb, pages, createdAt: Date.now() };
  await srv("receipts/" + id, { method: "PUT", body: JSON.stringify(rec) });
  for (let i = 0; i < pgs.length; i++) await srv(`receipts/${pages[i].id}/img` + (i ? "?r=" + id : ""), { method: "PUT", body: await b64Blob(pgs[i].big) });
  S.receipts.push({ ...rec, id });
  b.links = b.links || {}; b.links[txId] = id; await persist(S.month);
  render(); toast("Čeks pievienots un piesaistīts darījumam");
}
function findDialog(txId, q = "") {
  const b = S.banks.find(x => x.id === S.month), t = b && b.txs.find(x => x.id === txId); if (!t) return;
  let el = $("#fd"); if (!el) { el = document.createElement("div"); el.id = "fd"; document.body.appendChild(el); }
  el.dataset.tx = txId; const { used } = matchAll(), day = s => Date.parse((s || "1970-01-01") + "T00:00:00Z") / 864e5, ql = norm(q);
  const list = S.receipts.filter(r => !ql || norm((r.shop && r.shop.name) + " " + fmtDate(r.date) + " " + (r.total ?? "") + " " + money(r.total) + " " + (r.note || "") + " " + (r.text || "")).includes(ql))
    .map(r => ({ r, sc: (Math.abs(Number(r.total) - Math.abs(t.amount)) < .005 ? 0 : 1000) + Math.abs(day(r.date) - day(t.date)) + (used.has(r.id) ? 500 : 0) })).sort((a, b) => a.sc - b.sc).slice(0, 40);
  el.innerHTML = `<div class="box"><div class="row"><b style="flex:1">Piesaistīt čeku darījumam: ${fmtDate(t.date)} · ${esc(t.name || "")} · ${money(t.amount)} €</b><button class="btn sm" data-fd="x">✕</button></div>
    <input type="text" id="fd-q" placeholder="Meklēt pēc veikala, datuma vai summas" value="${esc(q)}">
    ${list.length ? list.map(({ r }) => `<button class="it" data-fd="${r.id}"><span class="tn" style="background-image:url('${esc(r.thumb || "")}')"></span><span><b>${esc((r.shop && r.shop.name) || "Bez veikala")}</b> · <span class="num">${r.total != null && r.total !== "" ? money(r.total) + " €" : "—"}</span><small>${fmtDate(r.date)}${used.has(r.id) ? " · jau piesaistīts citam darījumam" : ""}</small></span></button>`).join("") : `<p class="hint">Nekas netika atrasts.</p>`}</div>`;
  const inp = $("#fd-q"); if (inp && q) { inp.focus(); inp.setSelectionRange(q.length, q.length); }
}
