name: Publicēt lapu

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # katru pirmdienu atjauno Uzņēmumu reģistra datus
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sagatavot lapu
        run: |
          mkdir site
          cp *.html site/
          curl -fsSL --retry 3 -o register.csv "https://data.gov.lv/dati/dataset/4de9697f-850b-45ec-8bba-61fa09ce932f/resource/25e80bf3-f107-4ab4-89ef-251b5b9374e9/download/register.csv"
          python3 tools/ur-prep.py register.csv site/ur-dati.bin
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
