<!doctype html>
<html lang="lv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Čeki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #eef0ef; --surface: #ffffff; --surface-2: #f6f7f6; --line: #d6dbd9; --ink: #18201e; --muted: #5d6965;
  --accent: #9e2a35; --accent-ink: #ffffff; --ok: #1f6d4c; --warn: #8a5a00; --warn-soft: #fbf0d8; --bad: #a3242f;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141917; --surface: #1c2220; --surface-2: #222a27; --line: #34403c; --ink: #e8edeb; --muted: #9aa7a2;
  --accent: #e0707a; --accent-ink: #1a0f10; --ok: #6fcf9f; --warn: #e6b450; --warn-soft: #3a2f15; --bad: #f08a92; color-scheme: dark } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body) }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px }
h1, h2 { margin: 0; text-wrap: balance }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
.bar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px }
.brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -.01em }
.bar a { color: var(--muted); text-decoration: none; font-size: 13px }
.bar a:hover { color: var(--ink) }
.store-note { margin-left: auto; font-size: 12px; color: var(--muted) }
button, input, select, textarea { font: inherit; color: inherit }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); cursor: pointer; font-weight: 500; white-space: nowrap }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.danger { color: var(--bad) }
.btn.big { padding: 16px 18px; font-size: 16px; flex: 1 1 220px }
.btn:disabled { opacity: .5; cursor: default }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0 }
input[type=text], input[type=date], input[type=number], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 9px; font-size: 16px; color: var(--ink) }
textarea { resize: vertical; min-height: 70px }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)) }
.grid .span2 { grid-column: span 2 }
@media (max-width: 520px) { .grid .span2 { grid-column: auto } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 16px; min-width: 0 }
.eyebrow { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.spacer { flex: 1 }
.hint { color: var(--muted); font-size: 13px; margin: 0 }
section.view { padding-top: 20px; display: grid; gap: 16px }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.summary div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px }
.summary b { font: 500 20px var(--f-mono) }
.filters { display: flex; gap: 8px; flex-wrap: wrap }
.filters select, .filters input { width: auto; flex: 1 1 160px; max-width: 320px }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: grid; align-content: start }
.card:hover { border-color: var(--muted) }
.card .th { aspect-ratio: 3/4; background: var(--surface-2) center / cover no-repeat }
.card .meta { padding: 8px 10px; display: grid; gap: 1px; min-width: 0 }
.card .meta b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.card .meta small { color: var(--muted) }
.card .miss { color: var(--warn) }
.empty { padding: 32px 18px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 860px) { .detail { grid-template-columns: minmax(0, 1fr) } }
.photo { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; justify-items: center }
.photo img { max-width: 100%; max-height: 80vh; border-radius: 4px; display: block }
.ur { display: grid; gap: 6px; background: var(--surface-2); border-radius: var(--r); padding: 12px }
.ur-out { display: grid; gap: 2px }
.ur-hit { text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: var(--r); cursor: pointer; display: grid; gap: 1px }
.ur-hit:hover, .ur-hit:focus-visible { background: var(--surface) }
.ur-hit small { color: var(--muted) }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: var(--r); font-size: 13px; z-index: 20; max-width: 90vw }
input[type=file] { display: none }
</style></head><body>
<header class="bar"><div class="wrap">
  <a href="./">← Sākums</a>
  <div class="brand"><h1>Čeki</h1></div>
  <span class="store-note" id="store-note">Ielādē…</span>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="f-cam" accept="image/*" capture="environment">
<input type="file" id="f-file" accept="image/*" multiple>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const money = n => new Intl.NumberFormat("lv-LV", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.round((Number(n) || 0) * 100) / 100);
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? `${m[3]}.${m[2]}.${m[1]}` : "—"; };
const MONTHS = ["janvāris", "februāris", "marts", "aprīlis", "maijs", "jūnijs", "jūlijs", "augusts", "septembris", "oktobris", "novembris", "decembris"];
const PAY = ["Karte", "Skaidra nauda", "Pārskaitījums", "Cits"];
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3000); }

/* ---------- glabāšana: serveris (Cloudflare D1) vai pārlūka IndexedDB ---------- */
const store = {
  mode: "local", locked: false,
  async init() {
    if (!location.protocol.startsWith("http")) return;
    try { const r = await fetch("api/ping", { cache: "no-store" }); const j = r.ok ? await r.json() : null; if (j && j.ok && j.db) { this.mode = "server"; this.locked = !!j.receiptsLocked; } } catch (e) {}
  },
  async srv(path, opt = {}, retry = true) {
    const headers = {};
    if (this.locked) {
      let t = ""; try { t = localStorage.getItem("rr-rtoken") || ""; } catch (e) {}
      if (!t) { t = (prompt("Ievadi čeku piekļuves atslēgu:") || "").trim(); if (t) try { localStorage.setItem("rr-rtoken", t); } catch (e) {} }
      headers.Authorization = "Bearer " + t;
    }
    const r = await fetch("api/" + path, { ...opt, headers });
    if (r.status === 401) { try { localStorage.removeItem("rr-rtoken"); } catch (e) {} if (retry) return this.srv(path, opt, false); throw new Error("Nepareiza atslēga"); }
    if (!r.ok) { let m = ""; try { m = (await r.json()).error; } catch (e) {} throw new Error(m || "Servera kļūda " + r.status); }
    return r;
  },
  idb() {
    return this._db || (this._db = new Promise((res, rej) => {
      const q = indexedDB.open("rr-cekus", 1);
      q.onupgradeneeded = () => { q.result.createObjectStore("r", { keyPath: "id" }); q.result.createObjectStore("i"); };
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    }));
  },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async list() {
    if (this.mode === "server") return (await this.srv("receipts")).json();
    const db = await this.idb(); return this.req(db.transaction("r").objectStore("r").getAll());
  },
  async put(rec) {
    rec.updatedAt = Date.now();
    if (this.mode === "server") { const { id, ...rest } = rec; await this.srv("receipts/" + id, { method: "PUT", body: JSON.stringify(rest) }); }
    else { const db = await this.idb(); await this.req(db.transaction("r", "readwrite").objectStore("r").put(rec)); }
  },
  async putImg(id, blob) {
    if (this.mode === "server") { await this.srv(`receipts/${id}/img`, { method: "PUT", body: await blobToB64(blob) }); }
    else { const db = await this.idb(); await this.req(db.transaction("i", "readwrite").objectStore("i").put(blob, id)); }
  },
  async getImg(id) {
    if (this.mode === "server") return (await this.srv(`receipts/${id}/img`)).blob();
    const db = await this.idb(); return this.req(db.transaction("i").objectStore("i").get(id));
  },
  async del(id) {
    if (this.mode === "server") await this.srv("receipts/" + id, { method: "DELETE" });
    else { const db = await this.idb(); const t = db.transaction(["r", "i"], "readwrite"); t.objectStore("r").delete(id); t.objectStore("i").delete(id); await new Promise(r => t.oncomplete = r); }
  }
};
function blobToB64(blob) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); }); }

/* ---------- bildes: EXIF datums, samazināšana, sīktēls ---------- */
async function exifDate(file) {
  try {
    const buf = await file.slice(0, 131072).arrayBuffer(); const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o < v.byteLength - 4) {
      const mk = v.getUint16(o), len = v.getUint16(o + 2);
      if (mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
        const t = o + 10, le = v.getUint16(t) === 0x4949, g16 = p => v.getUint16(p, le), g32 = p => v.getUint32(p, le);
        const readStr = (p, n) => { let s = ""; for (let i = 0; i < n - 1; i++) s += String.fromCharCode(v.getUint8(p + i)); return s; };
        const ifd = (off, want) => { const n = g16(t + off); for (let i = 0; i < n; i++) { const e = t + off + 2 + i * 12; if (g16(e) === want) return { type: g16(e + 2), cnt: g32(e + 4), val: g32(e + 8), pos: e + 8 }; } return null; };
        const ex = ifd(g32(t + 4), 0x8769);
        const d = (ex && ifd(ex.val, 0x9003)) || ifd(g32(t + 4), 0x0132);
        if (!d) return null;
        const s = readStr(t + d.val, d.cnt), m = /^(\d{4}):(\d{2}):(\d{2})/.exec(s);
        return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
      }
      if ((mk & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  } catch (e) {}
  return null;
}
async function decode(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) {} }
  return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { res(im); }; im.onerror = () => rej(new Error("Bildi neizdevās nolasīt")); im.src = u; });
}
function canvasBlob(src, max, q) {
  const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight, k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b), "image/jpeg", q));
}
async function prepImage(file) {
  const date = (await exifDate(file)) || (file.lastModified ? isoDate(new Date(file.lastModified)) : today());
  const im = await decode(file);
  let big = await canvasBlob(im, 1800, .82);
  if (big.size > 1_300_000) big = await canvasBlob(im, 1400, .7);
  const th = await canvasBlob(im, 260, .7);
  return { big, thumb: "data:image/jpeg;base64," + await blobToB64(th), date };
}

/* ---------- stāvoklis un skati ---------- */
const S = { list: [], loaded: false, cur: null, month: "all", q: "", confirmDel: false, busy: "" };
function monthKey(r) { return (r.date || "").slice(0, 7); }

function listView() {
  let rows = S.list.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
  const months = [...new Set(rows.map(monthKey).filter(Boolean))].sort().reverse();
  if (S.month !== "all") rows = rows.filter(r => monthKey(r) === S.month);
  if (S.q) { const q = S.q.toLowerCase(); rows = rows.filter(r => ((r.shop && r.shop.name || "") + " " + (r.note || "")).toLowerCase().includes(q)); }
  const sum = rows.reduce((a, r) => a + (Number(r.total) || 0), 0), vat = rows.reduce((a, r) => a + (Number(r.vat) || 0), 0);
  return `<section class="view">
    <div class="row">
      <button class="btn big primary" data-act="cam">Uzņemt čeka foto</button>
      <button class="btn big" data-act="file">Augšupielādēt bildi</button>
    </div>
    ${S.busy ? `<p class="hint">${esc(S.busy)}</p>` : ""}
    <div class="summary">
      <div><span class="eyebrow">Čeki</span><b>${rows.length}</b></div>
      <div><span class="eyebrow">Summa</span><b>${money(sum)} €</b></div>
      <div><span class="eyebrow">PVN (ja norādīts)</span><b>${money(vat)} €</b></div>
    </div>
    <div class="filters">
      <select id="f-month" aria-label="Mēnesis"><option value="all">Visi mēneši</option>${months.map(m => `<option value="${m}"${S.month === m ? " selected" : ""}>${m.slice(0, 4)}. ${MONTHS[Number(m.slice(5)) - 1]}</option>`).join("")}</select>
      <input type="text" id="f-q" placeholder="Meklēt pēc veikala vai piezīmes" value="${esc(S.q)}">
    </div>
    ${rows.length ? `<div class="cards">${rows.map(r => `<button class="card" data-open="${r.id}"><div class="th" style="background-image:url('${esc(r.thumb || "")}')"></div><div class="meta"><b>${esc(r.shop && r.shop.name || "Bez veikala")}</b><small class="num">${fmtDate(r.date)}</small>${r.total ? `<span class="num">${money(r.total)} €</span>` : `<span class="miss">bez summas</span>`}</div></button>`).join("")}</div>`
      : `<div class="empty">${S.list.length ? "Neviens čeks neatbilst filtram." : "Vēl nav neviena čeka. Uzņem foto vai augšupielādē bildi."}</div>`}
  </section>`;
}
function detailView() {
  const r = S.cur, sh = r.shop || {};
  return `<section class="view">
    <div class="row"><button class="btn" data-act="back">← Visi čeki</button><span class="spacer"></span>
      ${S.confirmDel ? `<span class="confirm">Dzēst čeku? <button class="btn danger" data-act="del-yes">Dzēst</button><button class="btn" data-act="del-no">Atcelt</button></span>` : `<button class="btn danger" data-act="del">Dzēst</button>`}
      <button class="btn" data-act="dl">Lejupielādēt bildi</button>
      <button class="btn primary" data-act="save">Saglabāt</button>
    </div>
    <div class="detail">
      <div class="photo"><img id="photo" alt="Čeka bilde" hidden><p class="hint" id="photo-note">Ielādē bildi…</p></div>
      <div class="panel">
        <div class="grid">
          <label class="f">Datums<input type="date" id="r-date" value="${esc(r.date || "")}"></label>
          <label class="f">Summa, EUR<input type="number" id="r-total" step="0.01" inputmode="decimal" value="${r.total ?? ""}"></label>
          <label class="f">No tās PVN, EUR (nav obligāti)<input type="number" id="r-vat" step="0.01" inputmode="decimal" value="${r.vat ?? ""}"></label>
          <label class="f">Apmaksas veids<select id="r-pay"><option value=""></option>${PAY.map(p => `<option${r.pay === p ? " selected" : ""}>${p}</option>`).join("")}</select></label>
        </div>
        <div class="ur">
          <span class="eyebrow">Veikala meklēšana Uzņēmumu reģistrā</span>
          <input type="text" id="ur-q" placeholder="Nosaukums vai reģistrācijas numurs" autocomplete="off">
          <div class="ur-out" id="ur-out"></div>
        </div>
        <div class="grid">
          <label class="f span2">Veikals / uzņēmums<input type="text" id="r-name" value="${esc(sh.name)}"></label>
          <label class="f">Reģistrācijas nr.<input type="text" id="r-regNo" value="${esc(sh.regNo)}"></label>
          <label class="f">PVN nr.<input type="text" id="r-vatNo" value="${esc(sh.vatNo)}"></label>
          <label class="f span2">Adrese<input type="text" id="r-address" value="${esc(sh.address)}"></label>
        </div>
        <label class="f">Piezīmes<textarea id="r-note">${esc(r.note)}</textarea></label>
        <p class="hint">Veikala dati tiek saglabāti tikai pie šī čeka, nevis klientu sarakstā.</p>
      </div>
    </div>
  </section>`;
}
function render() {
  const app = $("#app");
  if (!S.loaded) { app.innerHTML = `<section class="view"><p class="hint">Ielādē čekus…</p></section>`; return; }
  app.innerHTML = S.cur ? detailView() : listView();
  if (S.cur) showPhoto();
}
async function showPhoto() {
  const id = S.cur && S.cur.id;
  try {
    const blob = await store.getImg(id);
    if (!S.cur || S.cur.id !== id) return;
    if (!blob) { $("#photo-note").textContent = "Bilde nav atrasta."; return; }
    S.photoUrl && URL.revokeObjectURL(S.photoUrl);
    S.photoUrl = URL.createObjectURL(blob); S.photoBlob = blob;
    const im = $("#photo"); im.src = S.photoUrl; im.hidden = false; $("#photo-note").hidden = true;
  } catch (e) { const n = $("#photo-note"); if (n) n.textContent = "Bildi neizdevās ielādēt: " + e.message; }
}

/* ---------- darbības ---------- */
async function addFiles(files) {
  files = [...files].filter(f => f.type.startsWith("image/") || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
  if (!files.length) { toast("Izvēlies bildes failu"); return; }
  let last = null, n = 0;
  for (const f of files) {
    S.busy = `Saglabā ${++n}/${files.length}…`; render();
    try {
      const { big, thumb, date } = await prepImage(f);
      const rec = { id: uid(), createdAt: Date.now(), date, shop: {}, total: null, thumb };
      await store.putImg(rec.id, big); await store.put(rec);
      S.list.push(rec); last = rec;
    } catch (e) { console.warn(e); toast("Neizdevās saglabāt: " + e.message); }
  }
  S.busy = "";
  if (last) { S.cur = last; S.confirmDel = false; toast(files.length > 1 ? "Čeki saglabāti" : "Čeks saglabāts. Papildini datus."); }
  render();
}
function readForm() {
  const r = S.cur, num = id => { const v = $(id).value.trim().replace(",", "."); return v === "" ? null : Number(v); };
  r.date = $("#r-date").value || r.date; r.total = num("#r-total"); r.vat = num("#r-vat"); r.pay = $("#r-pay").value; r.note = $("#r-note").value.trim();
  r.shop = { name: $("#r-name").value.trim(), regNo: $("#r-regNo").value.trim(), vatNo: $("#r-vatNo").value.trim(), address: $("#r-address").value.trim() };
}
document.addEventListener("click", async e => {
  const o = e.target.closest("[data-open]"); if (o) { S.cur = S.list.find(r => r.id === o.dataset.open); S.confirmDel = false; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "cam") $("#f-cam").click();
  else if (act === "file") $("#f-file").click();
  else if (act === "back") { S.cur = null; S.confirmDel = false; render(); }
  else if (act === "del") { S.confirmDel = true; render(); }
  else if (act === "del-no") { S.confirmDel = false; render(); }
  else if (act === "del-yes") {
    const id = S.cur.id;
    try { await store.del(id); S.list = S.list.filter(r => r.id !== id); S.cur = null; S.confirmDel = false; toast("Čeks izdzēsts"); }
    catch (err) { toast("Neizdevās izdzēst: " + err.message); }
    render();
  }
  else if (act === "dl") {
    if (!S.photoBlob) return;
    const a = document.createElement("a"); a.href = URL.createObjectURL(S.photoBlob); a.download = `Ceks_${S.cur.date || "bez-datuma"}_${S.cur.id}.jpg`; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  else if (act === "save") {
    readForm(); b.disabled = true;
    try { await store.put(S.cur); toast("Saglabāts"); } catch (err) { toast("Neizdevās saglabāt: " + err.message); }
    b.disabled = false;
  }
});
for (const id of ["#f-cam", "#f-file"]) $(id).addEventListener("change", e => { const fs = e.target.files; if (fs && fs.length) addFiles(fs); e.target.value = ""; });
document.addEventListener("change", e => { if (e.target.id === "f-month") { S.month = e.target.value; render(); } });
document.addEventListener("input", e => {
  if (e.target.id === "f-q") { S.q = e.target.value; clearTimeout(S.qt); S.qt = setTimeout(() => { render(); const q = $("#f-q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); }
  if (e.target.id === "ur-q") { clearTimeout(urSearch.t); const v = e.target.value; urSearch.t = setTimeout(() => urSearch(v), 200); }
});

/* ---------- Uzņēmumu reģistra atvērtie dati (ur-dati.bin: gzip TSV regcode\tname\taddress) ---------- */
const UR = { state: "idle", rows: null, keys: null, p: null };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/["'„“”«»]/g, "");
function urLoad() {
  if (UR.p) return UR.p;
  UR.state = "loading";
  UR.p = (async () => {
    const r = await fetch("ur-dati.bin"); if (!r.ok) throw new Error(r.status);
    const buf = new Uint8Array(await r.arrayBuffer());
    let text;
    if (buf[0] === 0x1f && buf[1] === 0x8b) text = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    else text = new TextDecoder().decode(buf);
    UR.rows = text.split("\n").filter(Boolean).map(l => l.split("\t"));
    UR.keys = UR.rows.map(r => norm(r[1]));
    UR.state = "ready";
  })().catch(e => { console.warn("UR dati nav pieejami", e); UR.state = "missing"; });
  return UR.p;
}
const UR_API = "https://data.gov.lv/dati/api/3/action/datastore_search?resource_id=25e80bf3-f107-4ab4-89ef-251b5b9374e9&limit=30";
async function urLive(q) {
  try {
    const words = q.split(/\s+/).map(w => w.replace(/[^\p{L}\p{N}]/gu, "")).filter(Boolean);
    const qs = /^\d+$/.test(q) ? "&q=" + encodeURIComponent(q) : "&plain=false&q=" + encodeURIComponent(words.map(w => w + ":*").join(" & "));
    const r = await fetch(UR_API + qs); if (!r.ok) throw new Error(r.status);
    const j = await r.json(); UR.live = true;
    return j.result.records.filter(x => !x.terminated).slice(0, 8)
      .map(x => [String(x.regcode), x.name, [x.address, x.index ? "LV-" + String(x.index).padStart(4, "0") : ""].filter(Boolean).join(", ")]);
  } catch (e) { UR.live = false; UR.err = String((e && e.message) || e); return null; }
}
const hitHtml = (h, i) => `<button type="button" class="ur-hit" data-ur="${i}"><span>${esc(h[1])}</span><small class="num">${esc(h[0])} · ${esc(h[2] || "")}</small></button>`;
async function urSearch(q) {
  const out = $("#ur-out"); if (!out) return;
  q = q.trim();
  if (q.length < 3) { out.innerHTML = `<p class="hint">Ieraksti vismaz 3 simbolus.</p>`; return; }
  if (UR.live !== false) {
    const live = await urLive(q);
    if ($("#ur-q")?.value.trim() !== q) return;
    if (live) { UR.hits = live; out.innerHTML = live.length ? live.map(hitHtml).join("") : `<p class="hint">Nekas netika atrasts. Veikala datus vari ievadīt arī pats.</p>`; return; }
  }
  if (UR.state !== "ready") { out.innerHTML = `<p class="hint">Ielādē reģistra datus…</p>`; await urLoad(); }
  if (UR.state === "missing") { out.innerHTML = `<p class="hint">Reģistra dati šeit nav pieejami. Veikala datus ievadi pats.</p>`; return; }
  if ($("#ur-q")?.value.trim() !== q) return;
  const hits = []; const digits = /^\d+$/.test(q); const nq = norm(q).split(/\s+/).filter(Boolean);
  for (let i = 0; i < UR.rows.length && hits.length < 8; i++) {
    if (digits ? UR.rows[i][0].startsWith(q) : nq.every(w => UR.keys[i].includes(w))) hits.push(UR.rows[i]);
  }
  UR.hits = hits;
  out.innerHTML = hits.length ? hits.map(hitHtml).join("") : `<p class="hint">Nekas netika atrasts. Veikala datus vari ievadīt arī pats.</p>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ur]"); if (!b) return;
  const [reg, name, addr] = UR.hits[Number(b.dataset.ur)];
  $("#r-name").value = name; $("#r-regNo").value = reg; $("#r-address").value = addr || "";
  $("#ur-out").innerHTML = `<p class="hint">Aizpildīts no Uzņēmumu reģistra. Spied Saglabāt.</p>`;
  $("#r-total").focus();
});
